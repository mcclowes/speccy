name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  api-diff:
    name: Speccy diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build Speccy diff tool
        run: |
          npm run build -w speccy-core
          npm run build -w speccy-cli
      - name: Compare Speccy's example API
        run: |
          node packages/cli/dist/cli.js diff \
            "origin/${{ github.base_ref }}:apps/web/public/examples/managed-cards.yaml" \
            apps/web/public/examples/managed-cards.yaml \
            --format markdown >> "$GITHUB_STEP_SUMMARY"
